name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  server:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json

    - name: Install Dependencies
      run: cd backend && npm install

    - name: Lint
      run: cd backend && npm run lint

    - name: Test
      run: cd backend && npm test

  build-rust:
    name: Build Rust Native Module
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'
        cache-dependency-path: backend/rust-helper/package-lock.json

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Install Dependencies
      run: cd backend/rust-helper && npm install

    - name: Build Native Module
      run: cd backend/rust-helper && npm run build:release

    - name: Test Native Module
      run: cd backend/rust-helper && node tests/test.js

  findmedi-next:
    name: findmedi-next (Next.js app)
    runs-on: ubuntu-latest

    env:
      NEXT_TELEMETRY_DISABLED: 1

    steps:
    - uses: actions/checkout@v4

    # Node 22+ is required: this app runs Vitest 5 (engines: ^22.12.0 || ^24.0.0 || >=26)
    # and @testing-library/jest-dom 7 (engines: >=22), unlike the api job.
    - name: Use Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install Dependencies
      run: cd frontend && npm ci --no-audit --no-fund

    # NOTE: tsc ka baseline ~12,784 errors hai (strict mode, kabhi green nahi
    # hua). Step ko signal ke liye rakh rahe hain par blocking nahi — jab tak
    # error count track-waale baseline se neeche na aaye, ye step gate nahi hai.
    - name: Type Check (non-blocking, baseline ~12.7k errors)
      run: cd frontend && npm run typecheck
      continue-on-error: true

    - name: Test
      run: cd frontend && npm test

    - name: Build
      run: cd frontend && npm run build

    - name: Lint
      run: cd frontend && npm run lint

  e2e:
    name: Playwright E2E (frontend, mocked API)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install Dependencies
      run: cd frontend && npm ci --no-audit --no-fund

    - name: Install Playwright Chromium
      run: cd frontend && npx playwright install --with-deps chromium

    - name: Run E2E
      run: cd frontend && npm run test:e2e

    - name: Upload Playwright report
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: frontend/playwright-report
        retention-days: 7

  k6:
    name: k6 script validation
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install k6
      run: |
        sudo gpg -k
        sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
          --keyserver hkp://keyserver.ubuntu.com:80 \
          --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D68
        echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
          | sudo tee /etc/apt/sources.list.d/k6.list
        sudo apt-get update
        sudo apt-get install -y k6

    # Scripts ko run karne ke liye chahiye live BASE_URL + creds — CI me sirf
    # parse/option validation (module load + options thresholds) hoti hai.
    - name: Validate k6 scripts
      run: |
        for f in k6/*.js; do
          echo "::group::k6 inspect $f"
          k6 inspect "$f"
          echo "::endgroup::"
        done

