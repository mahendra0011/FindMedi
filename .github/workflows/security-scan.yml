# Security scanning: gitleaks, CodeQL, dependency review, and OSV scanner.
#
# IMPORTANT - sequencing (2026-10-05 audit):
# The gitleaks job scans the whole history, and `server/.env` with real
# credentials is still reachable there (old commits ~486f79b..df495796).
# Until the history is purged (git filter-repo) and secrets rotated, the
# gitleaks job will (correctly) FAIL.

name: Security Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # weekly, Monday 04:17 UTC
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (secrets)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # full history
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: CodeQL (javascript)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: github/codeql-action/init@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/autobuild@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3
      - uses: github/codeql-action/analyze@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4

  osv-scan:
    name: OSV Vulnerability Scanner
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: google/osv-scanner-action/osv-scanner-action@764c91816374ff2d8fc2095dab36eecd42d61638 # v1.9.2
        with:
          scan-args: |-
            --skip-git
            --recursive
            ./

  # P2-8: OWASP ZAP baseline against staging (NOT prod). Runs on the weekly
  # schedule + manual dispatch only — too slow/flaky per-push. Requires the
  # STAGING_URL repository secret; skips silently without it.
  zap-baseline:
    name: OWASP ZAP baseline (staging)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check STAGING_URL configured
        id: cfg
        run: test -n "${{ secrets.STAGING_URL }}" && echo "ready=true" >> "$GITHUB_OUTPUT" || echo "ready=false" >> "$GITHUB_OUTPUT"
      - uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        if: steps.cfg.outputs.ready == 'true'
        with:
          target: ${{ secrets.STAGING_URL }}
          fail_action: true
          allow_issue_writing: false

  # P3: SBOM (Syft) for backend + frontend lockfiles, kept as a build
  # artifact for release attestations and audit evidence.
  sbom:
    name: SBOM (Syft)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: anchore/sbom-action@9e07fd7fd4c7754e8b7de48b7823674442d75a35 # v0.20.3
        with:
          path: ./backend
          format: spdx-json
          output-file: sbom-backend.spdx.json
      - uses: anchore/sbom-action@9e07fd7fd4c7754e8b7de48b7823674442d75a35 # v0.20.3
        with:
          path: ./frontend
          format: spdx-json
          output-file: sbom-frontend.spdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sbom
          path: sbom-*.spdx.json
          retention-days: 90
