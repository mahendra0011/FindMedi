# Hudi DeltaStreamer: Kafka raw logs → s3://findmedi-data-lake MoR tables.
# Run (profile: lake up first):
# docker exec findmedi-flink-jobmanager ./bin/flink run \
#   -c org.apache.hudi.utilities.deltastreamer.HoodieDeltaStreamer \
#   /opt/hudi-utilities-bundle.jar \
#   --propsFile /opt/hudi/ride_telemetry.properties \
#   --source-class org.apache.hudi.utilities.sources.KafkaSource \
#   --payload-class org.apache.hudi.common.model.OverwriteWithLatestAvroPayload \
#   --schemaprovider-class org.apache.hudi.utilities.schema.SchemaRegistryProvider \
#   --target-base-path s3://findmedi-data-lake/hudi_ride_telemetry_historical \
#   --table-type MERGE_ON_READ --op UPSERT \
#   --checkpoint /tmp/hudi-checkpoint/ride-telemetry

hoodie.datasource.write.table.name=hudi_ride_telemetry_historical
hoodie.datasource.write.table.type=MERGE_ON_READ
hoodie.datasource.write.operation=upsert
hoodie.datasource.write.precombine.field=end_time
hoodie.datasource.write.recordkey.field=trip_id
hoodie.datasource.write.partitionpath.field=date_partition
hoodie.datasource.write.hive_style_partitioning=true
hoodie.datasource.hive_sync.enable=true
hoodie.datasource.hive_sync.database=default
hoodie.datasource.hive_sync.table=hudi_ride_telemetry_historical
hoodie.datasource.hive_sync.partition_fields=date_partition
hoodie.datasource.hive_sync.partition_extractor_class=org.apache.hudi.hive.SlashEncodedDayPartitionValueExtractor
hoodie.deltastreamer.source.kafka.topic=findmedi.telemetry.driver-locations.v1
hoodie.deltastreamer.source.kafka.bootstrap.servers=kafka:29092
hoodie.deltastreamer.checkpoint.key.serializer=org.apache.kafka.common.serialization.StringSerializer
hoodie.index.type=BLOOM
hoodie.index.bloom.num_entries=60000
hoodie.compact.inline=true
hoodie.compact.inline.max.delta.commits=5
hoodie.parquet.compression.codec=snappy
