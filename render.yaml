services:
  # ── 1. BACKEND (Web Service) ──
  - type: web
    name: medicore-backend
    env: node
    plan: free
    buildCommand: npm install --prefix server
    startCommand: npm start --prefix server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_URL
        sync: false  # isme frontend static site ka URL dalna: https://medicore-frontend.onrender.com
      - key: CORS_ORIGIN
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_DRIVE_REDIRECT_URI
        sync: false  # https://medicore-backend.onrender.com/api/drive/callback
      - key: GEMINI_API_KEY
        sync: false
      - key: REDIS_URL
        sync: false

  # ── 2. FRONTEND (Static Site) ──
  - type: web
    name: medicore-frontend
    env: static
    plan: free
    buildCommand: npm install --prefix client && npm run build --prefix client
    staticPublishPath: ./client/dist
    # SPA fallback - React Router ke liye
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false  # https://medicore-backend.onrender.com/api
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
      - key: VITE_MAPTILER_API_KEY
        sync: false
      - key: VITE_USE_MAPTILER_TILES
        value: true
      - key: VITE_USE_MAPTILER_GEOCODING
        value: true
      - key: VITE_OPENROUTESERVICE_API_KEY
        sync: false
