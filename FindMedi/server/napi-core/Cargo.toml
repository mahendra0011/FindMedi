[package]
name = "medi-core-napi"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", features = ["serde-json"] }
napi-derive = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "ico", "bmp"] }
flate2 = { version = "1", default-features = false, features = ["miniz_oxide"] }
csv = "1"
sha2 = "0.10"
rand = "0.8"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
