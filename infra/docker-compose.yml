version: '3.8'

services:
  # ==========================================
  # MONGODB REPLICA SET: System of Record
  # (Single-node replica set: enables transactions + change streams locally)
  # ==========================================
  mongo1:
    image: mongo:7.0
    container_name: findmedi-mongo1
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    restart: unless-stopped

  # ==========================================
  # VALHALLA: Self-Hosted Routing Engine
  # (Requires planet/monaco OSM tiles mounted at /custom_files; see runbook)
  # ==========================================
  valhalla:
    image: ghcr.io/nilsnolde/valhalla-valhalla:3.5.0
    container_name: findmedi-valhalla
    ports:
      - "8002:8002"
    volumes:
      - valhalla_tiles:/custom_files
    restart: unless-stopped
    profiles: ["routing"]

  # ==========================================
  # NGINX: Edge Reverse Proxy + TLS + Static Cache
  # ==========================================
  nginx:
    image: nginx:1.25-alpine
    container_name: findmedi-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - valhalla
    restart: unless-stopped
    profiles: ["edge"]

  # ==========================================
  # REDIS: Distributed Locks & Spatial Cache
  # ==========================================
  redis:
    image: redis:7.2-alpine
    container_name: findmedi-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped

  # ==========================================
  # APACHE KAFKA & ZOOKEEPER: Event Backbone
  # ==========================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: findmedi-zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: findmedi-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  # ==========================================
  # OPENSEARCH: Search & Audit Logs
  # ==========================================
  opensearch:
    image: opensearchproject/opensearch:2.12.0
    container_name: findmedi-opensearch
    environment:
      - cluster.name=findmedi-cluster
      - node.name=findmedi-node1
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - DISABLE_SECURITY_PLUGIN=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    ports:
      - "9200:9200"

  # ==========================================
  # APACHE PINOT: Real-Time OLAP Analytics
  # ==========================================
  pinot-controller:
    image: apachepinot/pinot:1.0.0
    container_name: findmedi-pinot-controller
    command: "QuickStart -type batch"
    ports:
      - "9000:9000"
    environment:
      JAVA_OPTS: "-Dplugins.dir=/opt/pinot/plugins -Xms256m -Xmx512m"

  # ==========================================
  # APACHE FLINK: Stateful Stream Processing
  # ==========================================
  flink-jobmanager:
    image: flink:1.18-scala_2.12-java11
    container_name: findmedi-flink-jobmanager
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager

  flink-taskmanager:
    image: flink:1.18-scala_2.12-java11
    container_name: findmedi-flink-taskmanager
    depends_on:
      - flink-jobmanager
    command: taskmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 2

volumes:
  redis_data:
  opensearch_data:
  mongo_data:
  valhalla_tiles:
