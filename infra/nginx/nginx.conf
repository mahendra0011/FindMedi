# Spec 17 — Edge tier: TLS termination, IP throttling, static cache.
# Upstreams expect 1-3 Node API instances (see MASTER-PHASED-ROADMAP Phase 6).
# Emergency SOS paths are NEVER throttled here either (see limit_except + map).
#
# INFRA-001: TLS is terminated here in production. Behind Render/managed LB the
# platform terminates at the edge; self-hosted production mounts a real cert:
#   1. put fullchain.pem + privkey.pem in infra/nginx/certs/ (mounted read-only)
#   2. `docker compose --profile certbot run --rm certbot` issues/renews them
# INF-B-01: the 443 block below is LIVE (not a commented placeholder) and the
# :80 server only serves the ACME challenge + 308-redirects to HTTPS, so bearer
# tokens, `secure` cookies and PHI never traverse cleartext.

worker_processes auto;

events {
  worker_connections 4096;
}

http {
  # ── P3 edge hardening ──
  # server_tokens: never advertise the nginx version in banners/errors.
  server_tokens off;
  # Slowloris budgets: a client that opens a request and dribbles the headers
  # or body no longer pins a worker for the default 60s+. Normal form/API
  # payloads arrive in well under this.
  client_header_timeout 15s;
  client_body_timeout 15s;
  send_timeout 15s;
  # P3 real client IPs. The rate zones below key on $binary_remote_addr; with
  # the default Docker-bridge or a cloud LB in front, EVERY request shares one
  # source IP, so auth_edge (5r/m) would throttle the entire user base as a
  # single client - the edge limit becomes a global outage, not a defence.
  # Only private/local peers are trusted for X-Forwarded-For, so a client on
  # the public internet can never spoof its way out of a bucket. Behind a
  # PUBLIC LB (Render, Cloudflare, ...) add its CIDR to this list or the
  # limiter keys on the LB's IP.
  set_real_ip_from 127.0.0.1;
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  # ── Rate zones (edge tier; GRL Redis tier runs in Node) ──
  # INFRA-002: split auth classes — login/refresh stay strict, OTP/verify and
  # 2FA get their own buckets so one flow cannot starve the other.
  limit_req_zone $binary_remote_addr zone=api_edge:20m rate=30r/s;
  limit_req_zone $binary_remote_addr zone=auth_edge:10m rate=5r/m;
  limit_req_zone $binary_remote_addr zone=otp_edge:10m rate=10r/m;
  limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

  # INFRA-004: edge must accept what the app accepts (25 MB uploads).
  client_max_body_size 25m;

  # INFRA-004: three API slots (PM2 cluster or compose `api` service).
  # Host-coupled dev default stays first; bring up :5002/:5003 (remove `down`)
  # or repoint at the compose/K8s service name (e.g. api:3000) in production.
  upstream findmedi_api {
    least_conn;
    server host.docker.internal:5001 max_fails=3 fail_timeout=10s;
    server host.docker.internal:5002 max_fails=3 fail_timeout=10s down;
    server host.docker.internal:5003 max_fails=3 fail_timeout=10s down;
    keepalive 64;
  }

  upstream valhalla_router {
    server valhalla:8002 max_fails=10 fail_timeout=5s;
  }


  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Real-IP $remote_addr;

  # Security headers on every response (INFRA-001).
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(self)" always;
  # §14.4: XS-Leak / Spectre isolation — cross-origin windows se response read nahi.
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Resource-Policy "same-site" always;
  # §18.6: dotfiles (.git/.env) kabhi serve nahi — secret/path leak ka sabse sasta rasta.
  location ~ /\.(?!well-known) { deny all; access_log off; log_not_found off; }
  # P3 CSP - the subset that cannot break the SPA: no script-src/img-src/
  # connect-src yet (the built bundle legitimately talks to Google GSI, map
  # tile CDNs and avatar services; locking those needs a browser smoke test
  # first - tracked as a handoff item). These four directives still close
  # base-tag hijacking, form exfiltration, plugin paths and clickjacking, and
  # frame-ancestors is the modern twin of X-Frame-Options DENY above.
  add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
  # INF-B-01: HSTS is emitted by the 443 server block below (add_header is
  # per-server in nginx and is NOT inherited into a block that has its own).

  server {
    # INF-B-01: TLS is no longer an optional commented-out block. This server
    # only terminates TLS and 301s everything to HTTPS — no application traffic,
    # no cookies, no bearer tokens ever traverse cleartext.
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # This block declares its own add_header set, so the http-level headers are
    # NOT inherited here (nginx drops inherited add_headers the moment a level
    # redeclares any). Permissions-Policy was exactly that gap - it lived only
    # at http level and went missing on every TLS response, which is where the
    # camera/mic-using telemedicine traffic actually runs. Keep this list in
    # sync with the http block above.
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(self)" always;
    add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # The proxy blocks below intentionally mirror the :80 application server so
    # TLS traffic is handled here rather than being redirected to itself.
    include /etc/nginx/snippets/findmedi-proxy-locations.conf;
  }

  # INF-B-01: port 80 exists ONLY for the ACME HTTP-01 challenge and to redirect.
  # `secure` cookies (csrf.js / auth in production) are dropped by browsers on
  # cleartext, so serving the app here silently broke auth on an HTTP-only deploy.
  server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Certbot webroot renewal must stay reachable over plain HTTP.
    location ^~ /.well-known/acme-challenge/ {
      root /var/www/certbot;
      default_type "text/plain";
    }

    # P3 metrics: never even redirect a scrape-path probe (443 serves the
    # app and 404s there - see the same location in the snippet).
    location = /metrics {
      return 404;
    }

    location / {
      return 308 https://$host$request_uri;
    }
  }
}
