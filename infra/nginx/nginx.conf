# Spec 17 — Edge tier: TLS termination, IP throttling, static cache.
# Upstreams expect 1-3 Node API instances (see MASTER-PHASED-ROADMAP Phase 6).
# Emergency SOS paths are NEVER throttled here either (see limit_except + map).

worker_processes auto;

events {
  worker_connections 4096;
}

http {
  # ── Rate zones (edge tier; GRL Redis tier runs in Node) ──
  limit_req_zone $binary_remote_addr zone=api_edge:20m rate=30r/s;
  limit_req_zone $binary_remote_addr zone=auth_edge:10m rate=5r/m;
  limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

  upstream findmedi_api {
    least_conn;
    server host.docker.internal:5001 max_fails=3 fail_timeout=10s;
    # server host.docker.internal:5002 max_fails=3 fail_timeout=10s;
    # server host.docker.internal:5003 max_fails=3 fail_timeout=10s;
    keepalive 64;
  }

  upstream valhalla_router {
    server valhalla:8002 max_fails=10 fail_timeout=5s;
  }

  server {
    listen 80;
    server_name _;

    # Emergency SOS bypass: no edge throttling on life-safety paths.
    location ~ ^/api/(emergency|emergency-sos|emergency-doctor|sos) {
      proxy_pass http://findmedi_api;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_connect_timeout 5s;
      proxy_read_timeout 120s;
    }

    location /api/auth/ {
      limit_req zone=auth_edge burst=5 nodelay;
      proxy_pass http://findmedi_api;
    }

    location /api/ {
      limit_req zone=api_edge burst=60 nodelay;
      limit_conn conn_per_ip 50;
      proxy_pass http://findmedi_api;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_connect_timeout 5s;
      proxy_read_timeout 60s;
    }

    location /route/ {
      proxy_pass http://valhalla_router;
    }

    location /health {
      access_log off;
      proxy_pass http://findmedi_api;
    }
  }
}
