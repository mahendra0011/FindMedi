# Dedicated admin hostname (admin.findmedi.in) — access control template.
#
# Two layers, both mandatory in production:
#   1. Edge deny-by-default allowlist (below): only your office/VPN egress ranges.
#   2. In-app RBAC + step-up 2FA (see middleware/stepUpAuth.js + IAM routes).
#
# DO NOT put a user's home/ISP IP range here — dynamic and broad. Use a
# managed access gateway (VPN concentrator, Cloudflare Access tunnel, WireGuard
# hub, or a bastion with static egress).
#
# Example (replace 203.0.113.0/24 with your real egress CIDR, then remove this
# placeholder section before go-live):
#
#   allow 203.0.113.0/24;        # office VPN egress (IPv4)
#   allow 2001:db8:abcd::/48;    # office VPN egress (IPv6)
#   deny  all;
#
# Verify: `curl -I https://admin.findmedi.in/` from an approved range (200/301)
# and from an outside network (403). Document results in the deploy runbook.

deny all;
