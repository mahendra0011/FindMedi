# Shared application locations for FindMedi (INF-B-01).
# Included by BOTH the :443 TLS server block and the (optional) plaintext upstream
# so TLS traffic is served here instead of being redirected to itself.
# Requires the upstream + limit_req zones defined in nginx.conf.

# Emergency SOS bypass: no edge throttling on life-safety paths.
location ~ ^/api/(emergency|emergency-sos|emergency-doctor|sos) {
  proxy_pass http://findmedi_api;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  proxy_connect_timeout 5s;
  proxy_read_timeout 120s;
}

location /api/auth/login {
  limit_req zone=auth_edge burst=5 nodelay;
  limit_req_status 429;
  proxy_pass http://findmedi_api;
}

location ~ ^/api/auth/(verify-otp|resend-otp|2fa) {
  limit_req zone=otp_edge burst=10 nodelay;
  limit_req_status 429;
  proxy_pass http://findmedi_api;
}

location /api/auth/ {
  limit_req zone=auth_edge burst=5 nodelay;
  limit_req_status 429;
  proxy_pass http://findmedi_api;
}

location /api/ {
  limit_req zone=api_edge burst=60 nodelay;
  limit_req_status 429;
  limit_conn conn_per_ip 50;
  proxy_pass http://findmedi_api;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  proxy_connect_timeout 5s;
  proxy_read_timeout 60s;
}

# INF-B-07: orchestrator probes must not be edge-rate-limited or logged.
location = /healthz {
  access_log off;
  proxy_pass http://findmedi_api;
}

location = /readyz {
  access_log off;
  proxy_pass http://findmedi_api;
}

# INFRA-004: Valhalla tiles are internal-only — no direct external route.
# The /route/ open proxy is removed; navigation goes through /api/routing.
location = /health {
  access_log off;
  proxy_pass http://findmedi_api;
}

# SPA static assets. Hashed bundles are immutable; index.html must never be
# cached or a deploy leaves clients pinned to a dead bundle reference.
location ~* ^/assets/.*\.(js|css|woff2?|png|jpe?g|svg|webp)$ {
  proxy_pass http://findmedi_api;
  proxy_http_version 1.1;
  expires 1y;
  add_header Cache-Control "public, immutable";
  access_log off;
}

location = /index.html {
  proxy_pass http://findmedi_api;
  add_header Cache-Control "no-cache, must-revalidate";
}

# Client-side routing fallback for the Vite SPA.
location / {
  proxy_pass http://findmedi_api;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  proxy_connect_timeout 5s;
  proxy_read_timeout 60s;
}
