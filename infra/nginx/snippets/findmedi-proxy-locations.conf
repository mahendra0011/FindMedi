# Shared application locations for FindMedi (INF-B-01).
# Included by BOTH the :443 TLS server block and the (optional) plaintext upstream
# so TLS traffic is served here instead of being redirected to itself.
# Requires the upstream + limit_req zones defined in nginx.conf.

# Emergency SOS bypass: no edge throttling on life-safety paths.
# NOTE (P3): any location that declares its own proxy_set_header LOSES the
# http-level X-Forwarded-For / X-Forwarded-Proto / X-Real-IP trio (nginx only
# inherits proxy_set_header when the current level defines none). The trio is
# therefore repeated in every such location below - without it the Node app
# sees the proxy's IP as the client IP for all rate-limited API traffic.
location ~ ^/api/(emergency|emergency-sos|emergency-doctor|sos) {
  proxy_pass http://findmedi_api;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_connect_timeout 5s;
  proxy_read_timeout 120s;
}

location /api/auth/login {
  limit_req zone=auth_edge burst=5 nodelay;
  limit_req_status 429;
  proxy_pass http://findmedi_api;
}

location ~ ^/api/auth/(verify-otp|resend-otp|2fa) {
  limit_req zone=otp_edge burst=10 nodelay;
  limit_req_status 429;
  proxy_pass http://findmedi_api;
}

location /api/auth/ {
  limit_req zone=auth_edge burst=5 nodelay;
  limit_req_status 429;
  proxy_pass http://findmedi_api;
}

location /api/ {
  limit_req zone=api_edge burst=60 nodelay;
  limit_req_status 429;
  limit_conn conn_per_ip 50;
  proxy_pass http://findmedi_api;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  # Own proxy_set_header lines above => must redeclare the forwarding trio
  # (see the emergency-location note) or Node's GRL limiter keys on the proxy IP.
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_connect_timeout 5s;
  proxy_read_timeout 60s;
}

# INF-B-07: orchestrator probes must not be edge-rate-limited or logged.
location = /healthz {
  access_log off;
  proxy_pass http://findmedi_api;
}

location = /readyz {
  access_log off;
  proxy_pass http://findmedi_api;
}

# INFRA-004: Valhalla tiles are internal-only — no direct external route.
# The /route/ open proxy is removed; navigation goes through /api/routing.
location = /health {
  access_log off;
  proxy_pass http://findmedi_api;
}

# P3 metrics: Prometheus scrapes the app DIRECTLY (host.docker.internal:5001,
# Bearer METRICS_TOKEN - see infra/observability/prometheus.yml), so nothing
# legitimate needs /metrics through this vhost. 404 at the edge instead of
# relying solely on the app's metricsAuth (defence in depth): the scrape
# endpoint, its path and token scheme never see public traffic.
location = /metrics {
  return 404;
}

# SPA static assets. Hashed bundles are immutable; index.html must never be
# cached or a deploy leaves clients pinned to a dead bundle reference.
location ~* ^/assets/.*\.(js|css|woff2?|png|jpe?g|svg|webp)$ {
  proxy_pass http://findmedi_api;
  proxy_http_version 1.1;
  expires 1y;
  # Own add_header below shadows the http-level set - redeclare nosniff so JS
  # and CSS responses stay type-safe.
  add_header Cache-Control "public, immutable";
  add_header X-Content-Type-Options nosniff always;
  access_log off;
}

location = /index.html {
  proxy_pass http://findmedi_api;
  # Own add_header shadows the http-level security set - and this IS the HTML
  # document, the one response where CSP/X-Frame-Options matter most. Mirror
  # the full set from nginx.conf (keep in sync).
  add_header Cache-Control "no-cache, must-revalidate";
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(self)" always;
  add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
}

# Client-side routing fallback for the Vite SPA.
location / {
  proxy_pass http://findmedi_api;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  # Own proxy_set_header lines above => redeclare the forwarding trio (see the
  # emergency-location note) or the app sees the proxy IP as the client IP.
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_connect_timeout 5s;
  proxy_read_timeout 60s;
}
