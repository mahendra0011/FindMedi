# ==============================================================================
# FindMedi — Prometheus scrape configuration (INF-M-02)
# ==============================================================================
# Used by docker-compose.observability.yml. The API runs on the host (npm start)
# or in the prod compose stack, so it is scraped via the docker gateway:
#   host.docker.internal:5001  (backend default PORT; override with $BACKEND_PORT)
#
# The scrape itself is authenticated by METRICS_TOKEN — see
# backend/src/middleware/metricsAuth.js (fail-closed when the env is unset).
# docker-compose.observability.yml injects the same token into both sides.

global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

# Alerting is wired to Alertmanager if one is registered; without one the
# rules still evaluate and show up under Status -> Alerts, which is enough to
# prove the SLO signals exist before a real receiver is configured.
alerting:
  alertmanagers: []

scrape_configs:
  - job_name: findmedi-api
    metrics_path: /metrics
    authorization:
      type: Bearer
      # Same value the backend expects; compose passes METRICS_TOKEN to both
      # containers. Prometheus expands ${VAR} from its own environment.
      credentials: ${METRICS_TOKEN}
    static_configs:
      - targets: ["host.docker.internal:5001"]
        labels:
          service: findmedi-api
          env: dev
