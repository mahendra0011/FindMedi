# Istio mesh: STRICT mTLS everywhere (even inside VPC) + canary routing.
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: default
  namespace: findmedi
spec:
  mtls:
    mode: STRICT
---
apiVersion: security.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: api
  namespace: findmedi
spec:
  host: api.findmedi.svc.cluster.local
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
    outlierDetection:
      consecutive5xxErrors: 10
      interval: 5s
      baseEjectionTime: 5s
    connectionPool:
      tcp: { maxConnections: 200 }
  subsets:
    - name: stable
      labels: { version: stable }
    - name: canary
      labels: { version: canary }
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: api
  namespace: findmedi
spec:
  hosts: ["api.findmedi.svc.cluster.local"]
  http:
    - match:
        - headers:
            x-canary:
              exact: "1"
      route:
        - destination: { host: api.findmedi.svc.cluster.local, subset: canary }
    - route:
        - destination: { host: api.findmedi.svc.cluster.local, subset: stable }
          weight: 95
        - destination: { host: api.findmedi.svc.cluster.local, subset: canary }
          weight: 5
