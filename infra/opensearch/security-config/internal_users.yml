---
# =============================================================================
# FindMedi DEV — internal user database (DP-B-01)
# =============================================================================
# Base = image demo file, EXCEPT the admin bcrypt hash: image ka demo hash
# "admin" password ka hai, par compose healthcheck aur
# infra/opensearch/bootstrap/README.md dono OPENSEARCH_INITIAL_ADMIN_PASSWORD
# (dev default: findmedi_dev_opensearch) se auth karte hain.
#
# Regenerate the hash after changing the password:
#   docker run --rm --entrypoint bash opensearchproject/opensearch:2.12.0 \
#     /usr/share/opensearch/plugins/opensearch-security/tools/hash.sh -p <password>
#
# Mounted over /usr/share/opensearch/config/opensearch-security/internal_users.yml
# by infra/docker-compose.yml; installed into the security index at boot via
# plugins.security.allow_default_init_securityindex=true. DEV ONLY.
# =============================================================================
# The hash value is a bcrypt hash and can be generated with plugin/tools/hash.sh

_meta:
  type: "internalusers"
  config_version: 2

## FindMedi users

admin:
  hash: "$2y$12$sK/lH2Gu5HQHN079jcSqYujx/pJFYfL5MXPrUvAn5eKKvjL4LwgHy"
  reserved: true
  backend_roles:
  - "admin"
  description: "FindMedi dev admin (password = OPENSEARCH_INITIAL_ADMIN_PASSWORD)"

## Demo users (image defaults)

anomalyadmin:
  hash: "$2y$12$TRwAAJgnNo67w3rVUz4FIeLx9Dy/llB79zf9I15CKJ9vkM4ZzAd3."
  reserved: false
  opendistro_security_roles:
  - "anomaly_full_access"
  description: "Demo anomaly admin user, using internal role"

