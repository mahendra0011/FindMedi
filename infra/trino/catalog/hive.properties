# Trino catalog: Hive connector over MinIO (S3) data lake.
# Mounted at /etc/trino/catalog via compose (profile: lake).
connector.name=hive
hive.metastore.uri=thrift://hive-metastore:9083
hive.s3.endpoint=http://minio:9000
hive.s3.aws-access-key=findmedi
hive.s3.aws-secret-key=findmedi_dev_only_123
hive.s3.path-style-access=true
hive.s3.ssl.enabled=false
hive.storage-format=PARQUET
